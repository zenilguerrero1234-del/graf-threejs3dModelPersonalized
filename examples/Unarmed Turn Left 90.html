
<!DOCTYPE html>
<html lang="en">

<head>
    <title>three.js webgl - FBX loader</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">

    <meta property="og:title" content="three.js webgl - FBX loader">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://threejs.org/examples/Unarmed Turn Left 90.html">
    <meta property="og:image" content="https://threejs.org/examples/screenshots/webgl_loader_fbx.jpg">

    <link type="text/css" rel="stylesheet" href="main.css">
</head>

<body>

    <div id="info">
        <a href="https://threejs.org" target="_blank" rel="noopener">three.js</a> - FBXLoader<br />
        Character and animation from
        <a href="https://www.mixamo.com/" target="_blank" rel="noopener">Mixamo</a>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "../build/three.module.js",
                "three/addons/": "./jsm/"
            }
        }
    </script>

    <script type="module">

        import * as THREE from 'three';

        import Stats from 'three/addons/libs/stats.module.js';

        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
        import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

        const manager = new THREE.LoadingManager();

        let camera, scene, renderer, controls, stats, object, loader, guiMorphsFolder, guiAnimationsFolder;
        let mixer;

        const timer = new THREE.Timer();
        timer.connect(document);

        const params = {
            asset: 'Unarmed Turn Left 90'
        };

        const assets = [
            'Samba Dancing',
            'Double Dagger Stab',
            'Flying Knee Punch Combo',
            'Standing Idle 03',
            'Swinging',
            'Unarmed Turn Left 90',
            'morph_test',
            'monkey',
            'monkey_embedded_texture',
            'vCube',
            'archer/ArcherRi01',
            'warrior/Warrior',
            'stanford-bunny',
            'mixamo',
            'RotationTest',
            'exampleWindow',
            'Head_69',
            'morph-translation',
            'ball_anims_asc_2018',
        ];

        const scales = new Map();

        scales.set('warrior/Warrior', 100);
        scales.set('archer/ArcherRi01', 100);
        scales.set('stanford-bunny', 0.001);
        scales.set('Head_69', 100);
        scales.set('ball_anims_asc_2018', 50);

        init();

        function init() {

            const container = document.createElement('div');
            document.body.appendChild(container);

            camera = new THREE.PerspectiveCamera(
                45,
                window.innerWidth / window.innerHeight,
                1,
                2000
            );

            camera.position.set(100, 200, 300);

            scene = new THREE.Scene();

            // Fondo oscuro estilo videojuego
            scene.background = new THREE.Color(0x0b1020);
            scene.fog = new THREE.Fog(0x0b1020, 200, 1000);

            // Iluminación ambiental
            const hemiLight = new THREE.HemisphereLight(
                0xc9ddff,
                0x222b40,
                3
            );

            hemiLight.position.set(0, 200, 0);
            scene.add(hemiLight);

            // Iluminación principal superior
            const dirLight = new THREE.DirectionalLight(
                0xffffff,
                4
            );

            dirLight.position.set(0, 200, 100);
            dirLight.castShadow = true;

            dirLight.shadow.camera.top = 180;
            dirLight.shadow.camera.bottom = -100;
            dirLight.shadow.camera.left = -120;
            dirLight.shadow.camera.right = 120;

            scene.add(dirLight);

            // Luz secundaria azul para destacar la armadura
            const rimLight = new THREE.DirectionalLight(
                0x35d5ff,
                1.5
            );

            rimLight.position.set(-150, 100, -100);
            scene.add(rimLight);

            // Suelo oscuro
            const mesh = new THREE.Mesh(
                new THREE.PlaneGeometry(2000, 2000),
                new THREE.MeshPhongMaterial({
                    color: 0x1b2435,
                    depthWrite: false,
                    shininess: 50
                })
            );

            mesh.rotation.x = -Math.PI / 2;
            mesh.receiveShadow = true;
            scene.add(mesh);

            // Cuadrícula tecnológica
            const grid = new THREE.GridHelper(
                2000,
                20,
                0x17c7cf,
                0x253650
            );

            grid.material.opacity = 0.18;
            grid.material.transparent = true;
            scene.add(grid);

            loader = new FBXLoader(manager);
            loadAsset(params.asset);

            renderer = new THREE.WebGLRenderer({
                antialias: true
            });

            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;

            renderer.setAnimationLoop(animate);

            container.appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);

            controls.enableZoom = false;
            controls.enablePan = false;
            controls.enableDamping = true;
            controls.target.set(0, 100, 0);
            controls.update();

            window.addEventListener('resize', onWindowResize);

            // Estadísticas
            stats = new Stats();
            container.appendChild(stats.dom);

            // Interfaz de control
            const gui = new GUI();

            gui.add(params, 'asset', assets).onChange(function (value) {
                loadAsset(value);
            });

            guiMorphsFolder = gui.addFolder('Morphs').hide();
            guiAnimationsFolder = gui.addFolder('Animations').hide();

        }

        function loadAsset(asset) {

            loader.trimAnimationClips = (asset === 'ball_anims_asc_2018');

            loader.load('models/fbx/' + asset + '.fbx', function (group) {

                if (object) {

                    object.traverse(function (child) {

                        if (child.isSkinnedMesh) {
                            child.skeleton.dispose();
                        }

                        if (child.material) {

                            const materials = Array.isArray(child.material)
                                ? child.material
                                : [child.material];

                            materials.forEach(material => {

                                if (material.map) {
                                    material.map.dispose();
                                }

                                material.dispose();

                            });
                        }

                        if (child.geometry) {
                            child.geometry.dispose();
                        }

                    });

                    scene.remove(object);

                }

                object = group;

                const scale = scales.get(asset);
                object.scale.setScalar(scale || 1);

                // Configuración de las animaciones
                guiAnimationsFolder.children.forEach((child) => child.destroy());
                guiAnimationsFolder.hide();

                if (object.animations && object.animations.length) {

                    mixer = new THREE.AnimationMixer(object);

                    const action = mixer.clipAction(object.animations[0]);
                    action.play();

                    const clips = object.animations;

                    const animationParams = {
                        clip: clips[0].name
                    };

                    guiAnimationsFolder.show();

                    guiAnimationsFolder.add(
                        animationParams,
                        'clip',
                        clips.map((clip) => clip.name)
                    ).onChange(function (name) {

                        mixer.stopAllAction();

                        const clip = THREE.AnimationClip.findByName(clips, name);
                        mixer.clipAction(clip).play();

                    });

                } else {

                    mixer = null;

                }

                // Configuración de morphs
                guiMorphsFolder.children.forEach((child) => child.destroy());
                guiMorphsFolder.hide();

                // Diseño del personaje Dark Knight
                const paletaPersonaje = [

                    {
                        color: 0x17243b,
                        specular: 0x8ca9cc,
                        shininess: 90,
                        emissive: 0x06101f,
                        intensidad: 0.05
                    },

                    {
                        color: 0xb72d45,
                        specular: 0xffb7c1,
                        shininess: 110,
                        emissive: 0x360612,
                        intensidad: 0.08
                    },

                    {
                        color: 0xd8aa4a,
                        specular: 0xffe9ad,
                        shininess: 130,
                        emissive: 0x332000,
                        intensidad: 0.08
                    },

                    {
                        color: 0x17c7cf,
                        specular: 0xbfffff,
                        shininess: 120,
                        emissive: 0x00383b,
                        intensidad: 0.16
                    },

                    {
                        color: 0x394b63,
                        specular: 0xdce8f5,
                        shininess: 85,
                        emissive: 0x101b2b,
                        intensidad: 0.05
                    }

                ];

                let indicePieza = 0;

                // Personalización del modelo 3D
                object.traverse(function (child) {

                    if (child.isMesh) {

                        child.castShadow = true;
                        child.receiveShadow = true;

                        // Materiales personalizados del personaje
                        if (child.material) {

                            const aplicarMaterialPersonaje = (materialOriginal) => {

                                // Obtener estilo de la paleta
                                const estilo = paletaPersonaje[
                                    indicePieza % paletaPersonaje.length
                                ];

                                indicePieza++;

                                // Modificar material Phong original
                                if (materialOriginal.isMeshPhongMaterial) {

                                    materialOriginal.color.setHex(estilo.color);

                                    materialOriginal.specular.setHex(estilo.specular);

                                    materialOriginal.shininess = estilo.shininess;

                                    materialOriginal.emissive.setHex(estilo.emissive);

                                    materialOriginal.emissiveIntensity = estilo.intensidad;

                                    materialOriginal.needsUpdate = true;

                                    return materialOriginal;

                                }

                                // Crear material personalizado conservando texturas
                                const nuevoMaterial = new THREE.MeshPhongMaterial({

                                    color: estilo.color,

                                    map: materialOriginal.map || null,

                                    alphaMap: materialOriginal.alphaMap || null,

                                    normalMap: materialOriginal.normalMap || null,

                                    bumpMap: materialOriginal.bumpMap || null,

                                    bumpScale: materialOriginal.bumpScale,

                                    displacementMap: materialOriginal.displacementMap || null,

                                    displacementScale: materialOriginal.displacementScale,

                                    specular: estilo.specular,

                                    shininess: estilo.shininess,

                                    emissive: estilo.emissive,

                                    emissiveIntensity: estilo.intensidad,

                                    transparent: materialOriginal.transparent,

                                    opacity: materialOriginal.opacity,

                                    alphaTest: materialOriginal.alphaTest,

                                    side: materialOriginal.side,

                                    depthWrite: materialOriginal.depthWrite,

                                    wireframe: materialOriginal.wireframe

                                });

                                return nuevoMaterial;

                            };

                            if (Array.isArray(child.material)) {

                                child.material = child.material.map(
                                    aplicarMaterialPersonaje
                                );

                            } else {

                                child.material = aplicarMaterialPersonaje(
                                    child.material
                                );

                            }

                        }

                        // Control de morphs
                        if (child.morphTargetDictionary) {

                            guiMorphsFolder.show();

                            const meshFolder = guiMorphsFolder.addFolder(
                                child.name || child.uuid
                            );

                            Object.keys(child.morphTargetDictionary).forEach((key) => {

                                meshFolder.add(
                                    child.morphTargetInfluences,
                                    child.morphTargetDictionary[key],
                                    0,
                                    1,
                                    0.01
                                );

                            });

                        }

                    }

                });

                scene.add(object);

            });

        }

        function onWindowResize() {

            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();

            renderer.setSize(window.innerWidth, window.innerHeight);

        }

        function animate() {

            timer.update();

            const delta = timer.getDelta();

            if (mixer) {
                mixer.update(delta);
            }

            controls.update();

            renderer.render(scene, camera);

            stats.update();

        }

    </script>

</body>

</html>
